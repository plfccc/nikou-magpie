name: 公司发布前验证

# 公司fork只允许人工验证，不再向官方发布仓库发送dispatch或镜像官方资产。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-company-maintenance:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出当前公司提交
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 固定维护Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: 运行维护脚本与离线事务测试
        shell: pwsh
        run: |
          $testFiles = Get-ChildItem company/tests -Filter '*.test.mjs' | ForEach-Object { $_.FullName }
          node --test @testFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 提示正式发布门禁
        shell: pwsh
        run: |
          Write-Output '公司源码构建需在可访问Nikou权威源码和私服的Windows runner执行company/ci/windows-verify.ps1。'
          Write-Output '该工作流不构建、不推送、不发布，不代替source/artifacts/install证据。'
